services:
  # Backend: Node.js web service
  - type: web
    name: quizall-backend
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SYNC_TOKEN
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional override; defaults to claude-sonnet-4-6 in code
      - key: ANTHROPIC_MODEL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: OAUTH_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: quizall-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SUBSCRIPTIONS_ENABLED
        value: "false"

  # Frontend: Static site
  - type: web
    name: quizall-frontend
    runtime: static
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /science
        destination: /science/index.html
      - type: rewrite
        source: /science/
        destination: /science/index.html

databases:
  - name: quizall-db
    databaseName: quizall
