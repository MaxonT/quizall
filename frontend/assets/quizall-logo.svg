<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.55)"/>
      <stop offset="100%" stop-color="rgba(6,182,212,0.00)"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Icon box -->
  <rect x="6" y="6" rx="12" ry="12" width="44" height="44" fill="url(#g2)" />
  <!-- Q shape: circle + tail -->
  <circle cx="28" cy="25" r="9" fill="none" stroke="url(#g1)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="34" y1="31" x2="40" y2="39" stroke="url(#g1)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Wordmark -->
  <text x="64" y="36" font-family="Poppins, Inter, system-ui" font-weight="800" font-size="26" fill="url(#g1)">QuizAll</text>
</svg>
