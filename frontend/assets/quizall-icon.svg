<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00E0FF"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- background rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#bg)"/>
  <!-- Q shape: circle + tail -->
  <circle cx="30" cy="29" r="12" fill="none" stroke="url(#g1)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="38" y1="37" x2="46" y2="47" stroke="url(#g1)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>
</svg>
