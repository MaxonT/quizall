<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Session — QuizAll</title>
  <link rel="icon" href="assets/quizall-icon.svg" type="image/svg+xml" />
  <script src="lib/themeManager.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="quiz.css" />
  <script src="config.js"></script>
  <script src="lib/authGuard.js"></script>
  <script src="lib/i18next.min.js"></script>
  <script type="module" src="i18n/index.js"></script>
  <style>
    .quiz-shell {
      max-width: 900px;
      margin: 24px auto 80px;
      padding: 0 12px;
      display: grid;
      gap: 14px;
    }

    .session-head {
      border: 1px solid rgba(34,211,238,0.24);
      border-radius: 16px;
      padding: 14px;
      background: linear-gradient(145deg, rgba(10,16,37,0.94), rgba(8,13,30,0.95));
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .session-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.4;
      color: #ccfbf1;
    }

    .session-meta {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 4px;
    }

    .timer {
      border: 1px solid rgba(139,92,246,0.4);
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      color: #ddd6fe;
      font-size: 0.88rem;
      letter-spacing: 0.03em;
    }

    .timer-tools {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .timer-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .timer-control select,
    .timer-control input {
      border: 1px solid rgba(148,163,184,0.32);
      border-radius: 9px;
      background: rgba(10, 14, 31, 0.86);
      color: var(--text);
      padding: 5px 8px;
      font-size: 0.78rem;
      min-width: 86px;
    }

    .timer-apply-btn {
      border: 1px solid rgba(34, 211, 238, 0.38);
      border-radius: 9px;
      background: rgba(6, 182, 212, 0.14);
      color: #a5f3fc;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(6px);
      padding: 16px;
    }

    .confirm-overlay.open { display: flex; }

    .confirm-card {
      width: min(560px, 100%);
      border: 1px solid rgba(148,163,184,0.3);
      border-radius: 14px;
      padding: 16px;
      background: linear-gradient(145deg, rgba(10,16,37,0.98), rgba(8,13,30,0.96));
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      display: grid;
      gap: 12px;
    }

    .confirm-title {
      margin: 0;
      font-size: 1.06rem;
      color: var(--text);
    }

    .confirm-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .confirm-stats {
      border: 1px dashed rgba(148,163,184,0.32);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      gap: 6px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .progress-wrap {
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 14px;
      padding: 10px 12px;
      background: rgba(9, 14, 33, 0.82);
    }

    .progress-bar {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(148,163,184,0.2);
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22d3ee, #8b5cf6);
      transition: width .2s ease;
    }

    .question-card {
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 16px;
      padding: 14px;
      background: rgba(11, 17, 40, 0.88);
    }

    .question-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .question-head .left {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .q-number {
      font-size: 0.88rem;
      font-weight: 800;
      color: #a5f3fc;
    }

    .q-tag {
      border: 1px solid rgba(148,163,184,0.26);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .q-text {
      margin: 0;
      color: var(--text);
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .q-tip {
      margin: 8px 0 0;
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--muted);
      border-left: 2px solid rgba(34, 211, 238, 0.52);
      padding-left: 10px;
    }

    .answers {
      margin-top: 11px;
      display: grid;
      gap: 8px;
    }

    .option-btn,
    .tf-btn {
      border: 1px solid rgba(148,163,184,0.22);
      border-radius: 10px;
      padding: 10px;
      text-align: left;
      background: rgba(10, 14, 31, 0.88);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
      transition: border-color .15s ease, transform .15s ease;
    }

    .option-btn:hover,
    .tf-btn:hover { transform: translateY(-1px); }

    .option-btn.selected,
    .tf-btn.selected {
      border-color: rgba(34,211,238,0.62);
      background: rgba(34,211,238,0.16);
      color: #cffafe;
    }

    .free-input,
    .fill-input {
      width: 100%;
      border: 1px solid rgba(148,163,184,0.3);
      border-radius: 10px;
      background: rgba(8,12,28,0.86);
      color: var(--text);
      font: inherit;
      padding: 10px;
      font-size: 0.9rem;
    }

    .free-input {
      min-height: 90px;
      resize: vertical;
      line-height: 1.5;
    }

    .source-block {
      margin-top: 10px;
      border: 1px dashed rgba(34,211,238,0.36);
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(6, 32, 43, 0.28);
      color: #a5f3fc;
      font-size: 0.82rem;
      display: none;
    }

    .source-block.visible { display: block; }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      background: rgba(8, 12, 28, 0.9);
    }

    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="app-shell">
  <header class="topbar">
    <div class="brand brand-logo"><img src="assets/quizall-logo.svg" alt="QuizAll" class="logo-glow"/></div>
    <nav class="controls">
      <div class="navlinks">
        <a href="index.html" data-i18n="nav.dashboard">Dashboard</a>
        <a href="create.html" data-i18n="nav.create">AI Chat</a>
        <a href="/science/index.html" class="nav-science-link" data-i18n="nav.science">Science</a>
        <a href="history.html" data-i18n="nav.history">History</a>
        <a href="subscription.html" data-i18n="nav.subscription">Subscription</a>
        <a href="settings.html" data-i18n="nav.account">Account</a>
      </div>
      <div id="navUserBar" class="nav-user-bar"></div>
      <label class="control"><span data-i18n="appearance.label">Appearance</span>
        <select id="themeSelect"><option value="auto" data-i18n="appearance.auto">System</option><option value="light" data-i18n="appearance.light">Light</option><option value="dark" data-i18n="appearance.dark">Dark</option></select>
      </label>
      <label class="control"><span data-i18n="language.label">Language</span>
        <select id="langSelect"></select>
      </label>
    </nav>
  </header>

  <main class="quiz-shell">
    <section class="session-head">
      <div>
        <h1 id="sessionTitle" class="session-title">Quiz Session</h1>
        <div id="sessionMeta" class="session-meta"></div>
      </div>
      <div class="row" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
        <span id="timer" class="timer">00:00</span>
        <div class="timer-tools">
          <label class="timer-control">
            Timer
            <select id="timerPreset">
              <option value="0">No limit</option>
              <option value="10">10 min</option>
              <option value="20" selected>20 min</option>
              <option value="30">30 min</option>
              <option value="45">45 min</option>
              <option value="60">60 min</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <label class="timer-control" id="customTimerWrap" style="display:none;">
            Custom
            <input id="customTimerMinutes" type="number" min="1" max="300" step="1" value="25" />
          </label>
          <button id="applyTimerBtn" class="timer-apply-btn" type="button">Apply Timer</button>
        </div>
        <button id="restartBtn" class="btn" type="button">Start Over</button>
      </div>
    </section>

    <section class="progress-wrap">
      <div id="progressText">0 / 0 answered</div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
    </section>

    <section id="questionsContainer"></section>

    <section class="actions">
      <button id="submitBtn" class="btn btn-primary" type="button">Review & Submit</button>
    </section>
  </main>

  <section id="submitConfirmOverlay" class="confirm-overlay" aria-hidden="true">
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmSubmitTitle">
      <h2 id="confirmSubmitTitle" class="confirm-title">Submit Quiz Confirmation</h2>
      <p id="confirmSubmitNote" class="confirm-note">You can submit now, even if some questions are unanswered.</p>
      <div id="confirmSubmitStats" class="confirm-stats"></div>
      <div class="confirm-actions">
        <button id="confirmBackBtn" class="btn" type="button">Back to Quiz</button>
        <button id="confirmSubmitBtn" class="btn btn-primary" type="button">Confirm Submit</button>
      </div>
    </div>
  </section>

  <script src="lib/navUserBar.js"></script>
  <script src="lib/scienceData.js"></script>
  <script src="lib/scienceCommon.js"></script>
  <script>
  (function () {
    const ACTIVE_MODULE_QUIZ_KEY = 'quizall.activeModuleQuiz';
    const MODULE_MISSION_KEY_PREFIX = 'quizall.moduleMission.';
    const stored = sessionStorage.getItem('quizall.currentQuiz');
    if (!stored) {
      window.location.href = 'create.html';
      return;
    }

    const rawQuiz = JSON.parse(stored);
    const questionsRaw = Array.isArray(rawQuiz.questions) ? rawQuiz.questions : (Array.isArray(rawQuiz.quiz) ? rawQuiz.quiz : []);

    if (!questionsRaw.length) {
      window.location.href = 'create.html';
      return;
    }

    const quiz = {
      projectId: rawQuiz.projectId || (rawQuiz.project && rawQuiz.project.id) || null,
      projectName: (rawQuiz.project && rawQuiz.project.name) || '',
      subject: rawQuiz.subject || 'Quiz Session',
      topics: Array.isArray(rawQuiz.topics) ? rawQuiz.topics : [],
      questions: questionsRaw.map(normalizeQuestion)
    };

    const state = {
      answers: {},
      secondsElapsed: 0,
      timerLimitSeconds: 20 * 60,
      remainingSeconds: 20 * 60,
      timerId: null,
      eventsBound: false,
    };

    const els = {
      sessionTitle: document.getElementById('sessionTitle'),
      sessionMeta: document.getElementById('sessionMeta'),
      timer: document.getElementById('timer'),
      restartBtn: document.getElementById('restartBtn'),
      progressText: document.getElementById('progressText'),
      progressFill: document.getElementById('progressFill'),
      questionsContainer: document.getElementById('questionsContainer'),
      submitBtn: document.getElementById('submitBtn'),
      timerPreset: document.getElementById('timerPreset'),
      customTimerWrap: document.getElementById('customTimerWrap'),
      customTimerMinutes: document.getElementById('customTimerMinutes'),
      applyTimerBtn: document.getElementById('applyTimerBtn'),
      submitConfirmOverlay: document.getElementById('submitConfirmOverlay'),
      confirmSubmitStats: document.getElementById('confirmSubmitStats'),
      confirmSubmitNote: document.getElementById('confirmSubmitNote'),
      confirmBackBtn: document.getElementById('confirmBackBtn'),
      confirmSubmitBtn: document.getElementById('confirmSubmitBtn'),
    };

    function safeJsonParse(value, fallback) {
      try {
        if (!value) return fallback;
        return JSON.parse(value);
      } catch (_) {
        return fallback;
      }
    }

    function markModuleMissionDoneFromSession() {
      const payload = safeJsonParse(sessionStorage.getItem(ACTIVE_MODULE_QUIZ_KEY), null);
      if (!payload || !payload.projectId || !payload.moduleKey) return;
      if (quiz.projectId && String(quiz.projectId) !== String(payload.projectId)) return;

      const missionKey = MODULE_MISSION_KEY_PREFIX + String(payload.projectId);
      const mission = safeJsonParse(localStorage.getItem(missionKey), null);
      if (mission && Array.isArray(mission.items)) {
        let changed = false;
        mission.items.forEach(function (item) {
          if (item.moduleKey === payload.moduleKey && !item.done) {
            item.done = true;
            item.completedAt = new Date().toISOString();
            changed = true;
          }
        });
        if (changed) {
          localStorage.setItem(missionKey, JSON.stringify(mission));
        }
      }

      sessionStorage.setItem(ACTIVE_MODULE_QUIZ_KEY, JSON.stringify({
        projectId: payload.projectId,
        moduleKey: payload.moduleKey,
        moduleTitle: payload.moduleTitle || '',
        completed: true,
        completedAt: new Date().toISOString(),
      }));
    }

    function formatClock(totalSeconds) {
      const safe = Math.max(0, Number(totalSeconds) || 0);
      const mm = String(Math.floor(safe / 60)).padStart(2, '0');
      const ss = String(safe % 60).padStart(2, '0');
      return mm + ':' + ss;
    }

    function renderTimerDisplay() {
      if (state.timerLimitSeconds > 0) {
        els.timer.textContent = 'Left ' + formatClock(state.remainingSeconds);
        return;
      }
      els.timer.textContent = formatClock(state.secondsElapsed);
    }

    function normalizeType(type) {
      const raw = String(type || '').toLowerCase().replace(/[\s-]+/g, '_');
      if (raw === 'mcq') return 'multiple_choice';
      if (raw === 'tf') return 'true_false';
      if (raw === 'fib' || raw === 'fill_in_blank') return 'fill_in_the_blank';
      if (raw === 'frq' || raw === 'short_answer') return 'free_response';
      return raw || 'multiple_choice';
    }

    function buildQuestionTip(type) {
      const normalized = normalizeType(type);
      if (normalized === 'multiple_choice') {
        return 'Tip: eliminate weak options first, then pick the choice best supported by your materials.';
      }
      if (normalized === 'true_false') {
        return 'Tip: one wrong keyword makes the statement false; verify absolute words carefully.';
      }
      if (normalized === 'fill_in_the_blank') {
        return 'Tip: use the exact course term; concise and precise wording works best.';
      }
      return 'Tip: answer with structure: definition, key mechanism, and one concrete example.';
    }

    function normalizeQuestion(question) {
      const type = normalizeType(question.type);
      let options = null;
      if (type === 'multiple_choice') {
        options = (Array.isArray(question.options) ? question.options : []).map(function (option) {
          return String(option);
        });
        if (options.length < 2) {
          options = ['Option A', 'Option B', 'Option C', 'Option D'];
        }
      }

      let correct = question.correct_answer;
      if (type === 'multiple_choice') {
        const n = Number.parseInt(String(correct), 10);
        correct = Number.isInteger(n) ? n : 0;
      } else if (type === 'true_false') {
        correct = normalizeTf(correct);
      } else {
        correct = String(correct || '').trim();
      }

      return {
        type: type,
        question: String(question.question || question.text || 'Question unavailable').trim(),
        options: options,
        correct_answer: correct,
        explanation: String(question.explanation || '').trim(),
        tip: String(question.tip || question.hint || '').trim() || buildQuestionTip(type),
        source_reference: String(question.source_reference || question.source || 'Project materials').trim(),
        topic_node: String(question.topic_node || question.topic || 'General').trim(),
        difficulty: String(question.difficulty || 'medium').trim(),
      };
    }

    function normalizeTf(value) {
      const text = String(value || '').trim().toLowerCase();
      return (text === 'true' || text === '1' || text === 'yes') ? 'true' : 'false';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function friendlyType(type) {
      return {
        multiple_choice: 'MCQ',
        true_false: 'True / False',
        fill_in_the_blank: 'Fill in the Blank',
        free_response: 'FRQ'
      }[type] || type;
    }

    function startTimer() {
      if (state.timerId) clearInterval(state.timerId);
      state.timerId = setInterval(function () {
        state.secondsElapsed += 1;
        if (state.timerLimitSeconds > 0) {
          state.remainingSeconds = Math.max(0, state.remainingSeconds - 1);
          renderTimerDisplay();
          if (state.remainingSeconds <= 0) {
            if (state.timerId) clearInterval(state.timerId);
            openSubmitConfirmation(true);
          }
          return;
        }
        renderTimerDisplay();
      }, 1000);
    }

    function countAnswered() {
      return Object.keys(state.answers).length;
    }

    function updateProgress() {
      const total = quiz.questions.length;
      const answered = countAnswered();
      els.progressText.textContent = answered + ' / ' + total + ' answered';
      els.progressFill.style.width = (total ? (answered / total * 100) : 0) + '%';
    }

    function markAnswered(questionIndex) {
      const source = document.querySelector('[data-source-for="' + questionIndex + '"]');
      if (source) source.classList.add('visible');
      updateProgress();
    }

    function renderQuestions() {
      els.questionsContainer.innerHTML = '';
      quiz.questions.forEach(function (question, index) {
        const card = document.createElement('article');
        card.className = 'question-card';
        card.id = 'question-' + index;

        const optionsHtml = buildAnswerHtml(question, index);

        card.innerHTML =
          '<div class="question-head">' +
            '<div class="left">' +
              '<span class="q-number">Q' + (index + 1) + '</span>' +
              '<span class="q-tag">' + escapeHtml(friendlyType(question.type)) + '</span>' +
              '<span class="q-tag">' + escapeHtml(question.topic_node || 'General') + '</span>' +
            '</div>' +
            '<span class="q-tag">' + escapeHtml(question.difficulty || 'medium') + '</span>' +
          '</div>' +
          '<p class="q-text">' + escapeHtml(question.question) + '</p>' +
          '<p class="q-tip">💡 ' + escapeHtml(question.tip || buildQuestionTip(question.type)) + '</p>' +
          '<div class="answers">' + optionsHtml + '</div>' +
          '<div class="source-block" data-source-for="' + index + '">Source: ' + escapeHtml(question.source_reference) + '</div>';

        els.questionsContainer.appendChild(card);
      });
    }

    function buildAnswerHtml(question, questionIndex) {
      if (question.type === 'multiple_choice') {
        return question.options.map(function (option, optionIndex) {
          const label = String.fromCharCode(65 + optionIndex);
          return '<button class="option-btn" type="button" data-q="' + questionIndex + '" data-o="' + optionIndex + '"><strong>' + label + '.</strong> ' + escapeHtml(option) + '</button>';
        }).join('');
      }

      if (question.type === 'true_false') {
        return [
          '<button class="tf-btn" type="button" data-q="' + questionIndex + '" data-tf="true">True</button>',
          '<button class="tf-btn" type="button" data-q="' + questionIndex + '" data-tf="false">False</button>'
        ].join('');
      }

      if (question.type === 'fill_in_the_blank') {
        return '<input class="fill-input" data-q="' + questionIndex + '" placeholder="Type your answer" />';
      }

      return '<textarea class="free-input" data-q="' + questionIndex + '" placeholder="Write your free-response answer"></textarea>';
    }

    function resetSession() {
      if (!confirm('Start over? Current answers will be cleared.')) return;
      state.answers = {};
      state.secondsElapsed = 0;
      state.remainingSeconds = state.timerLimitSeconds > 0 ? state.timerLimitSeconds : 0;
      if (state.timerId) clearInterval(state.timerId);
      renderTimerDisplay();
      renderQuestions();
      startTimer();
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applyTimerSettings() {
      var preset = String(els.timerPreset.value || '0');
      var minutes;
      if (preset === 'custom') {
        minutes = Number.parseInt(String(els.customTimerMinutes.value || '0'), 10);
      } else {
        minutes = Number.parseInt(preset, 10);
      }

      if (!Number.isFinite(minutes) || minutes < 0) minutes = 0;
      if (minutes > 300) minutes = 300;

      state.timerLimitSeconds = minutes > 0 ? minutes * 60 : 0;
      state.secondsElapsed = 0;
      state.remainingSeconds = state.timerLimitSeconds > 0 ? state.timerLimitSeconds : 0;
      renderTimerDisplay();
      startTimer();
    }

    function updateTimerControls() {
      var isCustom = String(els.timerPreset.value) === 'custom';
      els.customTimerWrap.style.display = isCustom ? 'inline-flex' : 'none';
    }

    function closeSubmitConfirmation() {
      els.submitConfirmOverlay.classList.remove('open');
      els.submitConfirmOverlay.setAttribute('aria-hidden', 'true');
    }

    function openSubmitConfirmation(timerExpired) {
      const total = quiz.questions.length;
      const answered = countAnswered();
      const unanswered = Math.max(0, total - answered);
      const spent = formatClock(state.secondsElapsed);
      const usedTimerText = state.timerLimitSeconds > 0 ? (Math.round(state.timerLimitSeconds / 60) + ' min') : 'No limit';

      els.confirmSubmitNote.textContent = timerExpired
        ? 'Time is up. Please confirm submission now.'
        : 'You can submit now, even if some questions are unanswered.';
      els.confirmSubmitStats.innerHTML =
        '<div>Answered: <strong>' + answered + '</strong> / ' + total + '</div>' +
        '<div>Unanswered: <strong>' + unanswered + '</strong></div>' +
        '<div>Time spent: <strong>' + spent + '</strong></div>' +
        '<div>Timer mode: <strong>' + usedTimerText + '</strong></div>';

      els.submitConfirmOverlay.classList.add('open');
      els.submitConfirmOverlay.setAttribute('aria-hidden', 'false');
    }

    function evaluate(question, userAnswer) {
      if (question.type === 'multiple_choice') {
        return Number(userAnswer) === Number(question.correct_answer);
      }
      if (question.type === 'true_false') {
        return normalizeTf(userAnswer) === normalizeTf(question.correct_answer);
      }

      const user = String(userAnswer || '').trim().toLowerCase();
      const expected = String(question.correct_answer || '').trim().toLowerCase();
      if (!user || !expected) return false;

      if (question.type === 'free_response') {
        const tokens = expected.split(/\s+/).filter(function (token) { return token.length >= 4; });
        if (!tokens.length) return user === expected;
        const hits = tokens.filter(function (token) { return user.indexOf(token) >= 0; }).length;
        return hits >= Math.max(1, Math.ceil(tokens.length * 0.5));
      }

      return user === expected;
    }

    async function submitQuiz() {
      const total = quiz.questions.length;
      const results = [];
      let correct = 0;

      quiz.questions.forEach(function (question, index) {
        const answer = state.answers[index];
        const isCorrect = evaluate(question, answer);
        if (isCorrect) correct += 1;
        results.push({
          questionIndex: index,
          type: question.type,
          question: question.question,
          options: question.options,
          correct_answer: question.correct_answer,
          userAnswer: answer,
          isCorrect: isCorrect,
          explanation: question.explanation,
          tip: question.tip,
          source_reference: question.source_reference,
          topic_node: question.topic_node,
          difficulty: question.difficulty,
        });
      });

      const scorePercent = total ? Math.round((correct / total) * 100) : 0;
      const resultPayload = {
        projectId: quiz.projectId,
        projectName: quiz.projectName,
        subject: quiz.subject,
        topics: quiz.topics,
        total: total,
        correct: correct,
        score: scorePercent,
        timeSeconds: state.secondsElapsed,
        questions: results,
        answers: results.map(function (item) {
          return {
            questionIndex: item.questionIndex,
            answer: item.userAnswer,
            is_correct: item.isCorrect
          };
        }),
        completedAt: new Date().toISOString(),
      };

      sessionStorage.setItem('quizall.lastResult', JSON.stringify(resultPayload));
      sessionStorage.setItem('quizall.quizResults', JSON.stringify({
        subject: quiz.subject,
        projectId: quiz.projectId,
        questions: results,
        answers: state.answers,
        timeTaken: state.secondsElapsed * 1000,
      }));

      if (window.quizallScience && quiz.projectId) {
        window.quizallScience.markProjectFlags(quiz.projectId, { quizCompleted: true });
      }
      if (window.quizallScience) {
        window.quizallScience.queuePendingBadge({
          badgeId: 'quiz_completed',
          projectId: quiz.projectId || null,
          stepId: 'step03'
        });
      }
      markModuleMissionDoneFromSession();

      const authToken = (window.authGuard && window.authGuard.getToken && window.authGuard.getToken()) || localStorage.getItem('quizall.token');
      if (authToken) {
        fetch((window.authGuard ? window.authGuard.API_BASE : (window.QUIZALL_API_BASE || '')) + '/api/quiz/history', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + authToken
          },
          body: JSON.stringify(resultPayload)
        }).catch(function () {});
      }

      window.location.href = 'results.html';
    }

    function attachEvents() {
      if (state.eventsBound) return;
      state.eventsBound = true;

      els.questionsContainer.addEventListener('click', function (event) {
        const optionBtn = event.target.closest('.option-btn');
        if (optionBtn) {
          const q = Number(optionBtn.getAttribute('data-q'));
          const o = Number(optionBtn.getAttribute('data-o'));
          state.answers[q] = o;

          const scope = optionBtn.parentElement;
          scope.querySelectorAll('.option-btn').forEach(function (button) {
            button.classList.remove('selected');
          });
          optionBtn.classList.add('selected');
          markAnswered(q);
          return;
        }

        const tfBtn = event.target.closest('.tf-btn');
        if (tfBtn) {
          const q = Number(tfBtn.getAttribute('data-q'));
          const value = tfBtn.getAttribute('data-tf');
          state.answers[q] = value;

          const scope = tfBtn.parentElement;
          scope.querySelectorAll('.tf-btn').forEach(function (button) {
            button.classList.remove('selected');
          });
          tfBtn.classList.add('selected');
          markAnswered(q);
        }
      });

      els.questionsContainer.addEventListener('input', function (event) {
        const input = event.target.closest('.fill-input, .free-input');
        if (!input) return;

        const q = Number(input.getAttribute('data-q'));
        const value = input.value.trim();
        if (value) {
          state.answers[q] = value;
        } else {
          delete state.answers[q];
        }
        markAnswered(q);
      });

      els.restartBtn.addEventListener('click', resetSession);
      els.timerPreset.addEventListener('change', updateTimerControls);
      els.applyTimerBtn.addEventListener('click', applyTimerSettings);
      els.confirmBackBtn.addEventListener('click', closeSubmitConfirmation);
      els.confirmSubmitBtn.addEventListener('click', function () {
        if (state.timerId) clearInterval(state.timerId);
        closeSubmitConfirmation();
        submitQuiz();
      });
      els.submitConfirmOverlay.addEventListener('click', function (event) {
        if (event.target === els.submitConfirmOverlay) closeSubmitConfirmation();
      });
      els.submitBtn.addEventListener('click', function () {
        openSubmitConfirmation(false);
      });
    }

    function init() {
      els.sessionTitle.textContent = quiz.subject || 'Quiz Session';
      els.sessionMeta.textContent = [
        quiz.projectName ? ('Project: ' + quiz.projectName) : '',
        'Questions: ' + quiz.questions.length,
      ].filter(Boolean).join(' · ');

      updateTimerControls();
      renderTimerDisplay();
      renderQuestions();
      attachEvents();
      updateProgress();
      startTimer();
    }

    init();
  })();
  </script>
