<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuizAll — Study Chat</title>
  <link rel="icon" href="assets/quizall-icon.svg" type="image/svg+xml" />
  <script src="lib/themeManager.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="create.css" />
  <script src="config.js"></script>
  <script src="lib/authGuard.js"></script>
</head>
<body class="chat-app">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/quizall-icon.svg" alt="QuizAll" />
        <span>QuizAll</span>
      </div>
      <button type="button" class="btn-new-chat" id="newChatBtn">+ New chat</button>
      <div class="project-list" id="projectList">
        <div class="project-list-label">History</div>
      </div>
      <div class="sidebar-footer">
        <button type="button" class="avatar-btn" id="avatarBtn">
          <span class="avatar-circle" id="avatarInitials">U</span>
          <span class="avatar-email" id="avatarEmail">user</span>
        </button>
      </div>
    </aside>

    <main class="chat-main">
      <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">☰</button>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-inner" id="chatInner"></div>
      </div>
      <div class="composer" id="composer">
        <div class="composer-attachments" id="attachmentsBar"></div>
        <div class="composer-inner">
          <textarea id="composerInput" rows="1" placeholder="Paste study material or upload files…"></textarea>
          <div class="composer-actions">
            <button type="button" class="btn-icon" id="attachBtn" title="Attach files">📎</button>
            <button type="button" class="btn-send" id="sendBtn" title="Send">↑</button>
          </div>
        </div>
        <input id="fileInput" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.json" hidden />
      </div>
    </main>
  </div>

  <div class="popup-menu hidden" id="avatarMenu">
    <button type="button" id="menuSettings">Settings</button>
    <button type="button" id="menuUsage">Usage</button>
    <button type="button" id="menuBilling">Billing</button>
    <button type="button" id="menuPrivacy">Privacy</button>
    <div class="divider"></div>
    <button type="button" class="danger" id="menuLogout">Log out</button>
  </div>

  <div class="embed-overlay hidden" id="embedOverlay">
    <div class="embed-panel">
      <div class="embed-head">
        <h2 id="embedTitle">Panel</h2>
        <button type="button" class="embed-close" id="embedClose" aria-label="Close">×</button>
      </div>
      <iframe class="embed-frame" id="embedFrame" title="Embedded panel"></iframe>
    </div>
  </div>

  <script src="create.js"></script>
</body>
</html>
