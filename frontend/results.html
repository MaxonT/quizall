<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Results — QuizAll</title>
  <link rel="icon" href="assets/quizall-icon.svg" type="image/svg+xml" />
  <script src="lib/themeManager.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="quiz.css" />
  <script src="config.js"></script>
  <script src="lib/authGuard.js"></script>
  <script src="lib/i18next.min.js"></script>
  <script type="module" src="i18n/index.js"></script>
</head>
<body class="app-shell">
  <header class="topbar">
    <div class="brand brand-logo"><img src="assets/quizall-logo.svg" alt="QuizAll" class="logo-glow"/></div>
    <nav class="controls">
      <div class="navlinks">
        <a href="index.html" data-i18n="nav.dashboard">Dashboard</a>
        <a href="create.html" data-i18n="nav.create">Create Quiz</a>
        <a href="history.html" data-i18n="nav.history">History</a>
        <a href="settings.html" data-i18n="nav.settings">Settings</a>
        <a href="account.html" data-i18n="nav.account">Account</a>
      </div>
      <div id="navUserBar" class="nav-user-bar"></div>
      <label class="control"><span data-i18n="appearance.label">Appearance</span>
        <select id="themeSelect"><option value="auto" data-i18n="appearance.auto">System</option><option value="light" data-i18n="appearance.light">Light</option><option value="dark" data-i18n="appearance.dark">Dark</option></select>
      </label>
      <label class="control"><span data-i18n="language.label">Language</span>
        <select id="langSelect"></select>
      </label>
    </nav>
  </header>

  <main class="quiz-container" id="resultsMain">
    <!-- Score Card -->
    <div class="quiz-score-card" id="scoreCard">
      <div class="quiz-score-number" id="scoreNumber">0%</div>
      <div class="quiz-score-message" id="scoreMessage"></div>
      <div class="quiz-score-subtitle" id="scoreSubtitle"></div>
      <div class="quiz-score-time" id="scoreTime">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="timeTaken"></span>
      </div>
    </div>

    <!-- Difficulty Breakdown -->
    <h3 class="quiz-section-header">Difficulty Breakdown</h3>
    <div class="quiz-breakdown-grid" id="difficultyGrid">
      <div class="quiz-breakdown-card">
        <div class="quiz-breakdown-card__title easy">Easy</div>
        <div class="quiz-breakdown-card__count" id="easyCount">–</div>
        <div class="quiz-breakdown-bar"><div class="quiz-breakdown-bar__fill easy" id="easyBar" style="width:0%"></div></div>
      </div>
      <div class="quiz-breakdown-card">
        <div class="quiz-breakdown-card__title medium">Medium</div>
        <div class="quiz-breakdown-card__count" id="mediumCount">–</div>
        <div class="quiz-breakdown-bar"><div class="quiz-breakdown-bar__fill medium" id="mediumBar" style="width:0%"></div></div>
      </div>
      <div class="quiz-breakdown-card">
        <div class="quiz-breakdown-card__title hard">Hard</div>
        <div class="quiz-breakdown-card__count" id="hardCount">–</div>
        <div class="quiz-breakdown-bar"><div class="quiz-breakdown-bar__fill hard" id="hardBar" style="width:0%"></div></div>
      </div>
    </div>

    <!-- Topic Breakdown -->
    <div id="topicSection" style="display:none">
      <h3 class="quiz-section-header">Topic Breakdown</h3>
      <div class="quiz-topic-grid" id="topicGrid"></div>
    </div>

    <!-- Actions -->
    <div class="quiz-actions" id="actionButtons">
      <button class="quiz-action-btn primary" id="retryBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Retry
      </button>
      <a href="create.html" class="quiz-action-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Quiz
      </a>
      <a href="index.html" class="quiz-action-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
    </div>

    <!-- Review Section -->
    <h3 class="quiz-section-header">Review</h3>
    <div id="reviewContainer"></div>
  </main>

  <!-- Confetti canvas -->
  <div class="quiz-confetti" id="confettiContainer"></div>

  <script>
  (function () {
    const raw = sessionStorage.getItem('quizall.quizResults');
    if (!raw) {
      document.getElementById('resultsMain').innerHTML =
        '<div class="quiz-empty">' +
          '<div class="quiz-empty__icon">📋</div>' +
          '<h2 class="quiz-empty__title">No Results Found</h2>' +
          '<p class="quiz-empty__text">It looks like you haven\'t completed a quiz yet.</p>' +
          '<a href="create.html" class="quiz-action-btn primary" style="margin-top:12px">Create a Quiz</a>' +
        '</div>';
      return;
    }

    const data = JSON.parse(raw);
    const questions = data.questions || [];
    const answers   = data.answers   || {};
    const totalQ    = questions.length;
    let correctCount = 0;

    questions.forEach(function (q, i) {
      const userAns = answers[i];
      const isCorrect = checkAnswer(q, userAns);
      if (isCorrect) correctCount++;
    });

    const pct = totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0;

    /* Score color class */
    var scoreClass = pct >= 80 ? 'score-green' : pct >= 50 ? 'score-yellow' : 'score-red';
    var scoreEl = document.getElementById('scoreNumber');
    scoreEl.classList.add(scoreClass);

    /* Message */
    var msg = pct >= 80 ? 'Excellent!' : pct >= 50 ? 'Good effort!' : 'Keep studying!';
    document.getElementById('scoreMessage').textContent = msg;
    document.getElementById('scoreSubtitle').textContent = correctCount + ' of ' + totalQ + ' correct';

    /* Time */
    var elapsed = data.timeTaken || 0;
    document.getElementById('timeTaken').textContent = formatTime(elapsed);

    /* Animate score counter */
    animateCounter(scoreEl, pct, scoreClass);

    /* Confetti for high scores */
    if (pct >= 80) {
      setTimeout(function () { launchConfetti(); }, 400);
    }

    /* Difficulty breakdown */
    buildDifficultyBreakdown(questions, answers);

    /* Topic breakdown */
    buildTopicBreakdown(questions, answers);

    /* Review questions */
    buildReview(questions, answers);

    /* Retry button */
    document.getElementById('retryBtn').addEventListener('click', function () {
      if (data.quizConfig) {
        sessionStorage.setItem('quizall.quizConfig', JSON.stringify(data.quizConfig));
      }
      window.location.href = 'quiz.html';
    });

    /* ────────────────────── helpers ────────────────────── */

    function checkAnswer(q, userAns) {
      if (userAns === undefined || userAns === null || userAns === '') return false;
      var correct = (q.correctAnswer !== undefined) ? q.correctAnswer : q.answer;
      if (correct === undefined) return false;
      if (typeof correct === 'string' && typeof userAns === 'string') {
        return correct.trim().toLowerCase() === userAns.trim().toLowerCase();
      }
      return String(correct) === String(userAns);
    }

    function formatTime(ms) {
      var s = Math.floor(ms / 1000);
      var m = Math.floor(s / 60);
      s = s % 60;
      if (m > 0) return m + 'm ' + s + 's';
      return s + 's';
    }

    function animateCounter(el, target, cls) {
      var current = 0;
      var duration = 1200;
      var step = 16;
      var increment = target / (duration / step);
      el.textContent = '0%';
      var interval = setInterval(function () {
        current += increment;
        if (current >= target) {
          current = target;
          clearInterval(interval);
        }
        el.textContent = Math.round(current) + '%';
      }, step);
    }

    function buildDifficultyBreakdown(qs, ans) {
      var buckets = { easy: { total: 0, correct: 0 }, medium: { total: 0, correct: 0 }, hard: { total: 0, correct: 0 } };
      qs.forEach(function (q, i) {
        var d = (q.difficulty || 'medium').toLowerCase();
        if (!buckets[d]) d = 'medium';
        buckets[d].total++;
        if (checkAnswer(q, ans[i])) buckets[d].correct++;
      });

      ['easy', 'medium', 'hard'].forEach(function (key) {
        var b = buckets[key];
        var pctVal = b.total > 0 ? Math.round((b.correct / b.total) * 100) : 0;
        var countEl = document.getElementById(key + 'Count');
        var barEl   = document.getElementById(key + 'Bar');
        if (countEl) countEl.textContent = b.correct + ' / ' + b.total;
        if (barEl) {
          setTimeout(function () { barEl.style.width = pctVal + '%'; }, 300);
        }
      });
    }

    function buildTopicBreakdown(qs, ans) {
      var topics = {};
      qs.forEach(function (q, i) {
        var t = q.topic || q.subject || 'General';
        if (!topics[t]) topics[t] = { total: 0, correct: 0 };
        topics[t].total++;
        if (checkAnswer(q, ans[i])) topics[t].correct++;
      });

      var keys = Object.keys(topics);
      if (keys.length <= 1) return;

      document.getElementById('topicSection').style.display = '';
      var grid = document.getElementById('topicGrid');
      grid.innerHTML = '';
      keys.forEach(function (name) {
        var t = topics[name];
        var pctVal = t.total > 0 ? Math.round((t.correct / t.total) * 100) : 0;
        var card = document.createElement('div');
        card.className = 'quiz-topic-card';
        card.innerHTML =
          '<div class="quiz-topic-card__name">' + escHtml(name) + '</div>' +
          '<div class="quiz-topic-card__stat">' + t.correct + ' / ' + t.total + ' (' + pctVal + '%)</div>' +
          '<div class="quiz-topic-card__bar"><div class="quiz-topic-card__bar-fill" style="width:' + pctVal + '%"></div></div>';
        grid.appendChild(card);
      });
    }

    function buildReview(qs, ans) {
      var container = document.getElementById('reviewContainer');
      container.innerHTML = '';
      qs.forEach(function (q, i) {
        var userAns  = ans[i];
        var isCorrect = checkAnswer(q, userAns);
        var correctAns = (q.correctAnswer !== undefined) ? q.correctAnswer : q.answer;
        var card = document.createElement('div');
        card.className = 'quiz-question-card ' + (isCorrect ? 'review-correct' : 'review-wrong');
        card.style.animationDelay = (i * 0.06) + 's';

        var diffClass = (q.difficulty || 'medium').toLowerCase();
        var header =
          '<div class="quiz-question-header">' +
            '<span class="quiz-question-number">Q' + (i + 1) + '</span>' +
            '<span class="quiz-difficulty-badge ' + diffClass + '">' + capitalize(diffClass) + '</span>' +
            (q.type ? '<span class="quiz-type-badge">' + escHtml(q.type) + '</span>' : '') +
            (q.topic ? '<span class="quiz-topic-tag">' + escHtml(q.topic) + '</span>' : '') +
          '</div>';

        var questionText = '<p class="quiz-question-text">' + escHtml(q.question || q.text || '') + '</p>';

        var answersHtml = '';
        var type = (q.type || 'mcq').toLowerCase();

        if (type === 'mcq' || type === 'multiple_choice' || type === 'multiple choice') {
          answersHtml = buildMCQReview(q, userAns, correctAns, isCorrect);
        } else if (type === 'tf' || type === 'true_false' || type === 'true/false') {
          answersHtml = buildTFReview(userAns, correctAns, isCorrect);
        } else if (type === 'fib' || type === 'fill_in_blank' || type === 'fill in blank') {
          answersHtml = buildFIBReview(userAns, correctAns, isCorrect);
        } else {
          answersHtml = buildMCQReview(q, userAns, correctAns, isCorrect);
        }

        var explanation = '';
        if (q.explanation) {
          explanation =
            '<div class="quiz-explanation">' +
              '<span class="quiz-explanation__label">Explanation</span>' +
              escHtml(q.explanation) +
            '</div>';
        }

        if (!isCorrect) {
          var correctDisplay = '';
          if (Array.isArray(q.options) && typeof correctAns === 'number') {
            correctDisplay = q.options[correctAns] || String(correctAns);
          } else {
            correctDisplay = String(correctAns);
          }
          explanation = '<div class="quiz-correct-answer">Correct answer: ' + escHtml(correctDisplay) + '</div>' + explanation;
        }

        card.innerHTML = header + questionText + answersHtml + explanation;
        container.appendChild(card);
      });
    }

    function buildMCQReview(q, userAns, correctAns, isCorrect) {
      var opts = q.options || [];
      var html = '<div class="quiz-options">';
      opts.forEach(function (opt, idx) {
        var state = '';
        var label = String.fromCharCode(65 + idx);
        if (idx === Number(correctAns)) state = 'correct';
        if (idx === Number(userAns) && !isCorrect) state = 'wrong';
        if (idx === Number(userAns) && isCorrect) state = 'correct';
        html += '<div class="quiz-option ' + state + '">' +
          '<span class="quiz-option__marker">' + label + '</span>' +
          '<span>' + escHtml(opt) + '</span>' +
        '</div>';
      });
      html += '</div>';
      return html;
    }

    function buildTFReview(userAns, correctAns, isCorrect) {
      var html = '<div class="quiz-tf-group">';
      ['True', 'False'].forEach(function (val) {
        var normalUser = String(userAns).toLowerCase();
        var normalCorrect = String(correctAns).toLowerCase();
        var state = '';
        if (val.toLowerCase() === normalCorrect) state = 'correct';
        if (val.toLowerCase() === normalUser && !isCorrect) state = 'wrong';
        html += '<div class="quiz-tf-btn ' + state + '">' + val + '</div>';
      });
      html += '</div>';
      return html;
    }

    function buildFIBReview(userAns, correctAns, isCorrect) {
      return '<div class="quiz-fib-input ' + (isCorrect ? 'correct' : 'wrong') + '" style="pointer-events:none;padding:14px 18px">' +
        'Your answer: ' + escHtml(String(userAns || '(no answer)')) +
      '</div>';
    }

    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function launchConfetti() {
      var container = document.getElementById('confettiContainer');
      var colors = ['#7C3AED', '#06B6D4', '#22D3EE', '#4ADE80', '#F59E0B', '#F87171', '#fbbf24', '#8b5cf6'];
      for (var i = 0; i < 60; i++) {
        var piece = document.createElement('div');
        piece.className = 'quiz-confetti__piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = (Math.random() * 1.5) + 's';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.width  = (6 + Math.random() * 8) + 'px';
        piece.style.height = (6 + Math.random() * 8) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
        container.appendChild(piece);
      }
      setTimeout(function () { container.innerHTML = ''; }, 4500);
    }
  })();
  </script>
</body>
</html>
