<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Results — QuizAll</title>
  <link rel="icon" href="assets/quizall-icon.svg" type="image/svg+xml" />
  <script src="lib/themeManager.js"></script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="quiz.css" />
  <script src="config.js"></script>
  <script src="lib/authGuard.js"></script>
  <script src="lib/i18next.min.js"></script>
  <script type="module" src="i18n/index.js"></script>
  <style>
    .results-shell {
      max-width: 980px;
      margin: 24px auto 80px;
      padding: 0 12px;
      display: grid;
      gap: 14px;
    }

    .score-card {
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,0.22);
      background: linear-gradient(140deg, rgba(11,17,39,0.94), rgba(8,13,30,0.95));
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 14px;
    }

    .score-card h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      letter-spacing: -0.03em;
    }

    .score-meta {
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .score-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 112px;
      border-radius: 999px;
      font-size: 1.35rem;
      font-weight: 900;
      padding: 8px 14px;
      border: 1px solid rgba(148,163,184,0.32);
      background: rgba(8,12,28,0.84);
    }

    .score-good { color: #22c55e; border-color: rgba(34,197,94,0.46); }
    .score-mid { color: #f59e0b; border-color: rgba(245,158,11,0.46); }
    .score-low { color: #ef4444; border-color: rgba(239,68,68,0.5); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      background: rgba(10, 14, 30, 0.9);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: #fff;
    }

    .review-list {
      display: grid;
      gap: 10px;
    }

    .review-item {
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 14px;
      background: rgba(9,14,33,0.86);
      padding: 12px;
    }

    .review-item.correct {
      border-color: rgba(34,197,94,0.35);
      background: rgba(4,45,33,0.23);
    }

    .review-item.wrong {
      border-color: rgba(239,68,68,0.35);
      background: rgba(63,13,18,0.22);
    }

    .review-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .review-badge {
      border: 1px solid rgba(148,163,184,0.3);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .review-question {
      margin: 0;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .review-line {
      margin-top: 8px;
      font-size: 0.86rem;
      color: #dbeafe;
      line-height: 1.5;
    }

    .review-line strong {
      color: #a5f3fc;
    }

    .review-source {
      margin-top: 8px;
      border: 1px dashed rgba(34,211,238,0.34);
      border-radius: 10px;
      padding: 7px 9px;
      color: #a5f3fc;
      font-size: 0.8rem;
      background: rgba(8,35,47,0.24);
    }
  </style>
</head>
<body class="app-shell">
  <header class="topbar">
    <div class="brand brand-logo"><img src="assets/quizall-logo.svg" alt="QuizAll" class="logo-glow"/></div>
    <nav class="controls">
      <div class="navlinks">
        <a href="index.html" data-i18n="nav.dashboard">Dashboard</a>
        <a href="create.html" data-i18n="nav.create">Exam Prep Workspace</a>
        <a href="/science">Science</a>
        <a href="history.html" data-i18n="nav.history">History</a>
        <a href="settings.html" data-i18n="nav.account">Account</a>
      </div>
      <div id="navUserBar" class="nav-user-bar"></div>
      <label class="control"><span data-i18n="appearance.label">Appearance</span>
        <select id="themeSelect"><option value="auto" data-i18n="appearance.auto">System</option><option value="light" data-i18n="appearance.light">Light</option><option value="dark" data-i18n="appearance.dark">Dark</option></select>
      </label>
      <label class="control"><span data-i18n="language.label">Language</span>
        <select id="langSelect"></select>
      </label>
    </nav>
  </header>

  <main class="results-shell" id="resultsShell">
    <section class="score-card">
      <div>
        <h1 id="scoreTitle">Quiz Results</h1>
        <div id="scoreMeta" class="score-meta"></div>
      </div>
      <div id="scorePill" class="score-pill">0%</div>
    </section>

    <section class="actions">
      <a href="create.html" class="btn btn-primary">Back to Workspace</a>
      <a href="history.html" class="btn">Open History</a>
      <a href="/science#step03" class="btn">Why this worked</a>
      <a href="index.html" class="btn">Home</a>
    </section>

    <section>
      <h2 style="margin:0 0 10px; font-size:1.05rem;">Review</h2>
      <div id="reviewList" class="review-list"></div>
    </section>
  </main>

  <script src="lib/navUserBar.js"></script>
  <script src="lib/scienceData.js"></script>
  <script src="lib/scienceCommon.js"></script>
  <script>
  (function () {
    const raw = sessionStorage.getItem('quizall.lastResult');
    if (!raw) {
      const shell = document.getElementById('resultsShell');
      shell.innerHTML = '<section class="score-card"><h1 style="margin:0;">No result found</h1><p class="score-meta">Complete a quiz first.</p><a href="create.html" class="btn btn-primary">Go to Workspace</a></section>';
      return;
    }

    const data = JSON.parse(raw);
    const total = Number(data.total) || 0;
    const correct = Number(data.correct) || 0;
    const score = total > 0 ? Math.round(correct / total * 100) : (Number(data.score) || 0);

    const scorePill = document.getElementById('scorePill');
    scorePill.textContent = score + '%';
    scorePill.classList.add(score >= 80 ? 'score-good' : (score >= 60 ? 'score-mid' : 'score-low'));

    const minutes = Math.floor((Number(data.timeSeconds) || 0) / 60);
    const seconds = (Number(data.timeSeconds) || 0) % 60;
    const timeText = (minutes > 0 ? (minutes + 'm ') : '') + seconds + 's';

    const subject = data.subject || 'Quiz Session';
    document.getElementById('scoreTitle').textContent = subject;
    document.getElementById('scoreMeta').textContent =
      correct + ' / ' + total + ' correct' +
      (data.projectName || data.projectId ? (' · Project: ' + (data.projectName || data.projectId)) : '') +
      ' · Time: ' + timeText;

    if (window.quizallScience) {
      const pendingBadge = window.quizallScience.consumePendingBadge();
      if (pendingBadge && pendingBadge.badgeId) {
        if (pendingBadge.projectId) {
          window.quizallScience.markProjectFlags(pendingBadge.projectId, { quizCompleted: true });
        }
        window.quizallScience.showBadge(pendingBadge.badgeId, {
          stepId: pendingBadge.stepId || 'step03'
        });
      }
    }

    const reviewList = document.getElementById('reviewList');
    const questions = Array.isArray(data.questions) ? data.questions : [];
    if (!questions.length) {
      reviewList.innerHTML = '<p style="color:var(--muted); margin:0;">No question-level review data available.</p>';
      return;
    }

    reviewList.innerHTML = questions.map(function (item, index) {
      const correctClass = item.isCorrect ? 'correct' : 'wrong';
      const type = String(item.type || '').replace(/_/g, ' ');
      const yourAnswer = formatAnswer(item.userAnswer, item);
      const correctAnswer = formatCorrect(item);

      return '<article class="review-item ' + correctClass + '">' +
        '<div class="review-head">' +
          '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">' +
            '<span class="review-badge">Q' + (index + 1) + '</span>' +
            '<span class="review-badge">' + escapeHtml(type) + '</span>' +
            '<span class="review-badge">' + escapeHtml(item.topic_node || 'General') + '</span>' +
          '</div>' +
          '<span class="review-badge" style="color:' + (item.isCorrect ? '#22c55e' : '#ef4444') + ';">' + (item.isCorrect ? 'Correct' : 'Needs Review') + '</span>' +
        '</div>' +
        '<p class="review-question">' + escapeHtml(item.question || '') + '</p>' +
        '<div class="review-line"><strong>Your answer:</strong> ' + escapeHtml(yourAnswer) + '</div>' +
        '<div class="review-line"><strong>Expected:</strong> ' + escapeHtml(correctAnswer) + '</div>' +
        (item.explanation ? '<div class="review-line"><strong>Explanation:</strong> ' + escapeHtml(item.explanation) + '</div>' : '') +
        '<div class="review-source">Source: ' + escapeHtml(item.source_reference || 'Project materials') + '</div>' +
      '</article>';
    }).join('');

    function formatAnswer(answer, item) {
      if (answer == null || answer === '') return 'Not answered';
      if (item.type === 'multiple_choice') {
        const idx = Number(answer);
        if (Array.isArray(item.options) && idx >= 0 && idx < item.options.length) {
          return String.fromCharCode(65 + idx) + '. ' + item.options[idx];
        }
      }
      return String(answer);
    }

    function formatCorrect(item) {
      if (item.type === 'multiple_choice') {
        const idx = Number(item.correct_answer);
        if (Array.isArray(item.options) && idx >= 0 && idx < item.options.length) {
          return String.fromCharCode(65 + idx) + '. ' + item.options[idx];
        }
      }
      return String(item.correct_answer == null ? '' : item.correct_answer);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  })();
  </script>
</body>
</html>
